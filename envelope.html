<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F4ECDD">
<title>Reymond &amp; Ma. Joan — You're Invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
<link rel="prefetch" href="landing.html">
<style>
  :root{
    --ivory:#FAF6EF;
    --forest:#2E3B2C;
    --forest-soft:#4A5B45;
    --gold:#A8863F;
    --gold-soft:#C9AC72;
    --blush:#E7DED0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    background:
      radial-gradient(ellipse at 50% 38%, #FFFDF8 0%, rgba(255,253,248,0) 60%),
      radial-gradient(ellipse at 50% 120%, rgba(168,134,63,0.16), transparent 60%),
      var(--blush);
    font-family:'EB Garamond', serif;
    color:var(--forest);
    overflow:hidden;
  }

  .scene{
    position:relative; z-index:2;
    height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px 0 8vh;
    transition:opacity .55s ease;
  }
  .scene.leaving{ opacity:0; }

  /* ---------- ENVELOPE ---------- */
  .envelope{
    --w:min(92vw, 600px);
    position:relative;
    width:var(--w);
    height:calc(var(--w) * 0.66);
    perspective:1400px;
    animation:env-in 1s cubic-bezier(.2,.8,.2,1) backwards;
    transition:transform 1.1s cubic-bezier(.5,0,.2,1);
  }
  @keyframes env-in{
    from{ opacity:0; transform:translateY(26px) scale(.96); }
    to{ opacity:1; transform:none; }
  }
  .envelope > *{ position:absolute; }

  .env-back{
    inset:0;
    border-radius:3px;
    background:linear-gradient(180deg,#D9C79F,#CDB88C);
    box-shadow:0 34px 50px -22px rgba(70,48,20,.45), 0 8px 18px rgba(70,48,20,.18);
    z-index:1;
  }

  /* letter / invitation card */
  .letter{
    left:6%; top:7%;
    width:88%; height:88%;
    z-index:2;
    background:linear-gradient(180deg,#FFFDF8,#F8F1E4);
    border:1px solid var(--gold-soft);
    box-shadow:0 2px 10px rgba(70,48,20,.18);
    padding:2.2%;
    transform:translateY(0);
  }
  .letter::before{
    content:""; position:absolute; inset:2.2%;
    border:1px solid rgba(201,172,114,.65);
  }
  .letter-in{
    position:relative; height:100%;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; padding-top:calc(var(--w) * .035);
  }
  .l-eyebrow{
    margin:0; font-style:italic; color:var(--forest-soft);
    font-size:clamp(11px, calc(var(--w) * .026), 15px); letter-spacing:.04em;
  }
  .l-names{
    margin:.1em 0 0; font-family:'Tangerine','Cormorant Garamond',serif; font-weight:700;
    color:var(--forest); line-height:.95;
    font-size:clamp(30px, calc(var(--w) * .1), 64px); white-space:nowrap;
  }
  .l-names .amp{ color:var(--gold); font-size:.8em; margin:0 .08em; }
  .l-date{
    margin:.5em 0 0; letter-spacing:.16em; text-transform:uppercase;
    font-size:clamp(10px, calc(var(--w) * .022), 13px); color:var(--forest-soft);
  }

  /* front of the envelope (side + bottom flaps) */
  .pocket{ inset:0; width:100%; height:100%; z-index:3; display:block; overflow:visible; pointer-events:none; }

  /* soft shadow the closed top flap casts onto the pocket */
  .flap-shadow{
    left:0; top:0; width:100%; height:58%;
    z-index:3;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:rgba(60,40,16,.55);
    filter:blur(7px);
    transform:translateY(5px);
    opacity:.5;
    transition:opacity .35s ease;
    pointer-events:none;
  }

  /* top flap (rotates open around its top edge) */
  .flap{
    left:0; top:0; width:100%; height:58%;
    z-index:4;
    transform-origin:50% 0;
    transform-style:preserve-3d;
    pointer-events:none;
  }
  .flap svg{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; overflow:visible;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .flap .face-in{ transform:rotateY(180deg); }

  /* ---------- WAX SEAL BUTTON ---------- */
  .seal{
    --s:max(88px, calc(var(--w) * .24));
    left:50%; top:56.5%;
    width:var(--s); height:var(--s);
    margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    padding:0; border:0; background:none; cursor:pointer;
    z-index:6;
    border-radius:50%;
    animation:seal-breathe 2.8s ease-in-out 1.2s infinite;
  }
  .seal svg{
    width:100%; height:100%; display:block; overflow:visible;
    filter:drop-shadow(0 7px 5px rgba(70,14,8,.45));
    transition:transform .18s ease;
  }
  .seal:hover svg{ transform:scale(1.05) rotate(-2deg); }
  .seal:active svg{ transform:scale(.93); }
  .seal:focus-visible{ outline:2px solid var(--gold); outline-offset:6px; }
  .seal::after{               /* invitation ring that pulses outward */
    content:""; position:absolute; inset:-4px; border-radius:50%;
    border:2px solid rgba(168,134,63,.55);
    animation:seal-ping 2.8s ease-out 1.2s infinite;
    pointer-events:none;
  }
  @keyframes seal-breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.045); } }
  @keyframes seal-ping{
    0%{ transform:scale(.92); opacity:.9; }
    70%,100%{ transform:scale(1.45); opacity:0; }
  }

  .hint{
    margin:clamp(22px, 5vh, 40px) 0 0;
    font-style:italic; letter-spacing:.05em;
    font-size:clamp(15px, 4vw, 18px);
    color:var(--forest-soft);
    opacity:0;
    animation:hint-in 1s ease 1.3s forwards;
    transition:opacity .4s ease;
  }
  @keyframes hint-in{ to{ opacity:.85; } }

  /* ---------- OPENING SEQUENCE (added by JS on tap) ---------- */
  .opening .hint{ animation:none; opacity:0; }
  .opening .seal{ animation:seal-break .5s ease forwards; pointer-events:none; }
  .opening .seal::after{ animation:none; opacity:0; }
  .opening .flap-shadow{ opacity:0; }
  .opening .flap{ animation:flap-open 1s cubic-bezier(.45,.05,.3,1) .38s forwards; }
  .opening .letter{ animation:letter-rise 1.15s cubic-bezier(.4,0,.2,1) 1.05s forwards; }
  .opening .envelope{ transform:translateY(14%); }

  @keyframes seal-break{
    0%{ transform:scale(1); opacity:1; }
    28%{ transform:scale(.9); opacity:1; }
    100%{ transform:scale(1.35); opacity:0; }
  }
  @keyframes flap-open{
    0%{ transform:rotateX(0deg); z-index:4; }
    49%{ z-index:4; }
    50%{ z-index:1; }
    100%{ transform:rotateX(180deg); z-index:1; }
  }
  @keyframes letter-rise{
    to{ transform:translateY(-44%); }
  }

  /* wax crumbs flung out when the seal breaks */
  .crumb{
    position:absolute; z-index:7; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, #D8523F, #7E140C 70%);
    border-radius:45% 55% 50% 50%;
  }

  /* falling petals */
  .petal{
    position:fixed; top:-24px; z-index:1; pointer-events:none;
    animation:fall linear forwards;
  }
  .petal svg{ width:100%; height:100%; display:block; }
  @keyframes fall{
    0%{ transform:translateY(-24px) rotate(0deg); }
    100%{ transform:translateY(112vh) rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .envelope{ animation:none; }
    .seal, .seal::after{ animation:none; }
    .petal{ display:none; }
  }
</style>
</head>
<body>

<main class="scene" id="scene">
  <div class="envelope" id="envelope">
    <div class="env-back"></div>

    <div class="letter">
      <div class="letter-in">
        <p class="l-eyebrow">Together with their families</p>
        <h2 class="l-names">Reymond <span class="amp">&amp;</span> Ma. Joan</h2>
        <p class="l-date">November 28, 2026</p>
      </div>
    </div>

    <!-- front of envelope: left / right / bottom flaps -->
    <svg class="pocket" viewBox="0 0 600 396" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="gL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#EDE1C8"/><stop offset="1" stop-color="#DBCAA6"/>
        </linearGradient>
        <linearGradient id="gR" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#EDE1C8"/><stop offset="1" stop-color="#DBCAA6"/>
        </linearGradient>
        <linearGradient id="gB" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#FAF4E6"/><stop offset="1" stop-color="#EDE0C6"/>
        </linearGradient>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .22 0" result="g"/>
          <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
          <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
        </filter>
        <filter id="lift" x="-5%" y="-10%" width="110%" height="120%">
          <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#4a3414" flood-opacity=".28"/>
        </filter>
      </defs>
      <g filter="url(#grain)">
        <polygon points="0,0 300,198 0,396" fill="url(#gL)"/>
        <polygon points="600,0 300,198 600,396" fill="url(#gR)"/>
      </g>
      <g filter="url(#lift)">
        <polygon points="0,396 300,174 600,396" fill="url(#gB)"/>
      </g>
      <g fill="none" vector-effect="non-scaling-stroke">
        <polyline points="0,0 300,198 0,396" stroke="rgba(110,82,40,.30)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <polyline points="600,0 300,198 600,396" stroke="rgba(110,82,40,.30)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <polyline points="0,396 300,174 600,396" stroke="rgba(255,255,255,.75)" stroke-width="1.2" vector-effect="non-scaling-stroke" transform="translate(0,1)"/>
        <polyline points="0,396 300,174 600,396" stroke="rgba(110,82,40,.32)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </g>
    </svg>

    <div class="flap-shadow"></div>

    <!-- top flap: outer paper face + inner liner face -->
    <div class="flap" id="flap">
      <svg class="face-out" viewBox="0 0 600 230" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FCF8EE"/><stop offset="1" stop-color="#F1E6CF"/>
          </linearGradient>
          <filter id="grain2" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="8" result="n"/>
            <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .22 0" result="g"/>
            <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
            <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="gi"/></feMerge>
          </filter>
        </defs>
        <polygon points="0,0 600,0 300,230" fill="url(#gF)" filter="url(#grain2)"/>
        <polyline points="0,0 300,230 600,0" fill="none" stroke="rgba(110,82,40,.34)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <polyline points="4,1 300,226 596,1" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
      <svg class="face-in" viewBox="0 0 600 230" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="gFi" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#CDB88C"/><stop offset="1" stop-color="#DCCBA3"/>
          </linearGradient>
        </defs>
        <polygon points="0,0 600,0 300,230" fill="url(#gFi)"/>
        <polyline points="0,0 300,230 600,0" fill="none" stroke="rgba(90,66,28,.35)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>

    <!-- the wax seal = the button -->
    <button class="seal" id="seal" type="button" aria-label="Break the wax seal to open the invitation">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="waxBase" cx="38%" cy="32%" r="80%">
            <stop offset="0" stop-color="#D4513C"/>
            <stop offset=".55" stop-color="#A92A1B"/>
            <stop offset="1" stop-color="#6F120B"/>
          </radialGradient>
          <radialGradient id="waxDisc" cx="62%" cy="68%" r="85%">
            <stop offset="0" stop-color="#C23A27"/>
            <stop offset=".6" stop-color="#9C2416"/>
            <stop offset="1" stop-color="#7A170E"/>
          </radialGradient>
          <filter id="waxFx" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="5" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="disp"/>
            <feGaussianBlur in="disp" stdDeviation="2.4" result="blur"/>
            <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.1" specularExponent="62" lighting-color="#FFC9BA" result="spec">
              <feDistantLight azimuth="235" elevation="50"/>
            </feSpecularLighting>
            <feComposite in="spec" in2="disp" operator="in" result="specIn"/>
            <feComposite in="disp" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
          </filter>
        </defs>
        <g filter="url(#waxFx)">
          <path d="M190.7 100.0 C191.0 106.3 190.3 112.6 189.6 119.0 C188.8 125.4 188.7 132.5 186.1 138.3 C183.6 144.2 178.9 149.5 174.3 154.0 C169.8 158.5 164.3 162.3 159.0 165.5 C153.6 168.7 147.9 171.3 142.2 173.1 C136.5 174.9 130.4 175.1 124.7 176.1 C119.1 177.1 113.8 178.6 108.3 179.1 C102.8 179.6 97.4 179.1 91.7 179.1 C86.0 179.1 80.0 180.0 74.3 179.0 C68.6 178.1 63.3 175.5 57.6 173.5 C51.8 171.4 44.7 170.4 39.9 166.8 C35.1 163.2 31.9 157.0 28.8 151.7 C25.7 146.4 22.4 140.9 21.3 135.0 C20.2 129.2 21.6 122.3 22.3 116.5 C23.1 110.7 26.5 105.7 25.6 100.0 C24.7 94.3 18.5 88.6 16.7 82.3 C14.9 76.0 13.3 68.1 14.8 62.1 C16.3 56.0 21.4 50.6 25.8 46.1 C30.3 41.6 36.2 38.1 41.6 35.2 C47.1 32.2 53.1 30.6 58.6 28.3 C64.1 26.1 69.2 24.1 74.5 21.6 C79.9 19.2 85.2 14.9 90.9 13.7 C96.7 12.6 103.0 14.2 109.0 14.8 C114.9 15.4 121.3 15.5 126.8 17.4 C132.4 19.4 138.3 22.3 142.4 26.5 C146.5 30.8 148.1 38.2 151.4 42.9 C154.6 47.7 158.1 51.0 161.9 55.0 C165.7 59.0 169.9 62.6 174.1 67.0 C178.4 71.4 184.7 75.9 187.5 81.4 C190.2 86.9 190.3 93.7 190.7 100.0 Z" fill="url(#waxBase)"/>
          <path d="M190.7 100.0 C191.0 106.3 190.3 112.6 189.6 119.0 C188.8 125.4 188.7 132.5 186.1 138.3 C183.6 144.2 178.9 149.5 174.3 154.0 C169.8 158.5 164.3 162.3 159.0 165.5 C153.6 168.7 147.9 171.3 142.2 173.1 C136.5 174.9 130.4 175.1 124.7 176.1 C119.1 177.1 113.8 178.6 108.3 179.1 C102.8 179.6 97.4 179.1 91.7 179.1 C86.0 179.1 80.0 180.0 74.3 179.0 C68.6 178.1 63.3 175.5 57.6 173.5 C51.8 171.4 44.7 170.4 39.9 166.8 C35.1 163.2 31.9 157.0 28.8 151.7 C25.7 146.4 22.4 140.9 21.3 135.0 C20.2 129.2 21.6 122.3 22.3 116.5 C23.1 110.7 26.5 105.7 25.6 100.0 C24.7 94.3 18.5 88.6 16.7 82.3 C14.9 76.0 13.3 68.1 14.8 62.1 C16.3 56.0 21.4 50.6 25.8 46.1 C30.3 41.6 36.2 38.1 41.6 35.2 C47.1 32.2 53.1 30.6 58.6 28.3 C64.1 26.1 69.2 24.1 74.5 21.6 C79.9 19.2 85.2 14.9 90.9 13.7 C96.7 12.6 103.0 14.2 109.0 14.8 C114.9 15.4 121.3 15.5 126.8 17.4 C132.4 19.4 138.3 22.3 142.4 26.5 C146.5 30.8 148.1 38.2 151.4 42.9 C154.6 47.7 158.1 51.0 161.9 55.0 C165.7 59.0 169.9 62.6 174.1 67.0 C178.4 71.4 184.7 75.9 187.5 81.4 C190.2 86.9 190.3 93.7 190.7 100.0 Z" fill="none" stroke="#E4725E" stroke-opacity=".35" stroke-width="2" transform="translate(100 100) scale(.965) translate(-100 -100)"/>
          <!-- raised rim + dotted ring -->
          <circle cx="100" cy="100" r="63" fill="none" stroke="#7B190F" stroke-width="3" stroke-opacity=".55"/>
          <circle cx="100" cy="100" r="63" fill="none" stroke="#E6806C" stroke-width="1.2" stroke-opacity=".5" transform="translate(.9 .9)"/>
          <circle cx="100" cy="100" r="57" fill="none" stroke="#F0907D" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 7.1" stroke-opacity=".75"/>
          <circle cx="100" cy="100" r="57" fill="none" stroke="#5E0E07" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 7.1" stroke-opacity=".5" transform="translate(-.9 -.9)"/>
          <!-- inner disc -->
          <circle cx="100" cy="100" r="50" fill="url(#waxDisc)"/>
          <circle cx="100" cy="100" r="50" fill="none" stroke="#5E0E07" stroke-opacity=".45" stroke-width="1.6" transform="translate(-.8 -.8)"/>
          <circle cx="100" cy="100" r="50" fill="none" stroke="#F0907D" stroke-opacity=".45" stroke-width="1.2" transform="translate(.9 .9)"/>
          <!-- embossed monogram -->
          <g font-family="'Tangerine','Cormorant Garamond',cursive" font-weight="700" font-size="58" text-anchor="middle">
            <text x="98.8" y="115.2" fill="#4F0B05" fill-opacity=".85">R&amp;M</text>
            <text x="101.2" y="116.8" fill="#F29A87" fill-opacity=".6">R&amp;M</text>
            <text x="100" y="116" fill="#A02518">R&amp;M</text>
          </g>
        </g>
      </svg>
    </button>
  </div>

  <p class="hint" id="hint">Tap the seal to open</p>
</main>

<script>
(function(){
  var scene = document.getElementById("scene");
  var seal  = document.getElementById("seal");
  var env   = document.getElementById("envelope");
  var opened = false;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function goLanding(){ window.location.href = "landing.html"; }

  function crumbs(){
    var r = seal.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 14; i++){
      var c = document.createElement("div");
      c.className = "crumb";
      var size = 5 + Math.random() * 9;
      c.style.width = size + "px"; c.style.height = size + "px";
      c.style.left = (cx - size / 2) + "px"; c.style.top = (cy - size / 2) + "px";
      document.body.appendChild(c);
      var ang = Math.random() * Math.PI * 2;
      var dist = r.width * (.55 + Math.random() * .8);
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist * .8;
      var a = c.animate([
        { transform:"translate(0,0) scale(.6) rotate(0deg)", opacity:1 },
        { transform:"translate(" + dx + "px," + dy + "px) scale(1) rotate(" + (Math.random()*240-120) + "deg)", opacity:1, offset:.5 },
        { transform:"translate(" + (dx*1.1) + "px," + (dy + 70 + Math.random()*60) + "px) scale(.7) rotate(" + (Math.random()*360) + "deg)", opacity:0 }
      ], { duration: 850 + Math.random()*350, easing:"cubic-bezier(.2,.7,.3,1)", fill:"forwards" });
      a.onfinish = (function(el){ return function(){ el.remove(); }; })(c);
    }
  }

  function openInvitation(){
    if (opened) return;
    opened = true;
    if (reduce){
      scene.classList.add("leaving");
      setTimeout(goLanding, 350);
      return;
    }
    scene.classList.add("opening");
    crumbs();
    setTimeout(function(){ scene.classList.add("leaving"); }, 2500);
    setTimeout(goLanding, 3050);
  }
  seal.addEventListener("click", openInvitation);

  // a few drifting petals for atmosphere
  var petalSVG = '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2 C13 2 15 5 13 9 C17 8 19 11 17 14 C19 17 16 19 13 17 C13 20 9 20 9 17 C6 19 3 17 5 14 C1 13 2 9 6 9 C3 6 6 2 10 2 Z" fill="#C9AC72"/></svg>';
  function petal(){
    if (reduce) return;
    var p = document.createElement("div");
    p.className = "petal";
    p.innerHTML = petalSVG;
    var s = 10 + Math.random() * 9;
    p.style.width = s + "px"; p.style.height = s + "px";
    p.style.left = (Math.random() * 100) + "vw";
    p.style.opacity = .35 + Math.random() * .35;
    var d = 9 + Math.random() * 7;
    p.style.animationDuration = d + "s";
    document.body.appendChild(p);
    setTimeout(function(){ p.remove(); }, d * 1000 + 200);
  }
  setInterval(petal, 1100);
  for (var i = 0; i < 4; i++) setTimeout(petal, i * 400);
})();
</script>
</body>
</html>
